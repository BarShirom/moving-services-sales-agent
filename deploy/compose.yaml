name: moving-demo
services:
  backend:
    image: ${DEMO_BACKEND_IMAGE:?Set the reviewed backend image digest}
    platform: linux/amd64
    # Contains provider credentials and optional DEMO_* quota overrides; never commit.
    env_file: ${DEMO_BACKEND_ENV_FILE:?Set the absolute private backend env file path}
    environment:
      NODE_ENV: production
      PORT: "3001"
      DEMO_PUBLIC_ORIGIN: https://${DEMO_DOMAIN:?Set the canonical DNS hostname}
      DEMO_TRUSTED_PROXY_IP: 172.30.30.2
      CLIENT_ORIGIN: ""
    # Intentionally NO ports, host networking, extra networks, or Docker socket.
    networks:
      backend:
        ipv4_address: 172.30.30.3
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  caddy:
    # Verified custom image, local-only until a separately approved registry push.
    image: moving-services-sales-agent-caddy:bounded-review-20261011@sha256:2dcec600792dbe19d3bb5f08cd09b51b802290f3651eb4d3197f317d74e2609b
    platform: linux/amd64
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set the canonical DNS hostname}
    ports:
      # IPv4-only ingress: avoid IPv6-to-IPv4 userland-proxy source translation.
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    networks:
      edge: {}
      backend:
        ipv4_address: 172.30.30.2
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${DEMO_CLIENT_DIST:?Set the absolute prebuilt client dist directory}
        target: /srv
        read_only: true
        bind: {create_host_path: false}
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  edge: {}
  backend:
    driver: bridge
    # Unpublished NAT bridge, NOT internal: backend needs outbound OpenAI HTTPS.
    # Check for subnet collisions on the actual host before approval to deploy.
    ipam:
      config:
        - subnet: 172.30.30.0/29
          gateway: 172.30.30.1
volumes:
  caddy_data: {}
  caddy_config: {}
